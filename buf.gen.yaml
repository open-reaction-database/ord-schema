# Plugin versions are pinned exactly: test_proto_wrappers regenerates everything and fails on
# any drift from the committed output, so a floating version turns into a diff on an
# unrelated pull request.
version: v2
managed:
  # Managed mode writes Java, C#, PHP, Ruby, and Objective-C file options into every
  # descriptor. None of the generators below read them, so they would only change the
  # bytes embedded in the generated Python.
  enabled: false
plugins:
  - remote: buf.build/protocolbuffers/python:v22.3
    out: .
  - remote: buf.build/protocolbuffers/pyi:v22.3
    out: .
  - remote: buf.build/protocolbuffers/js:v3.21.2
    out: js
    opt:
      - import_style=commonjs
      - binary
  # The BSR has no ts-protoc-gen plugin, so it runs from PATH: ts-protoc-gen 0.15.0, the
  # version test_proto_wrappers installs.
  - local: protoc-gen-ts
    out: js
