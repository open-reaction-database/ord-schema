version: v2
modules:
  - path: .
    # The module root is the repository, because that is where the proto import paths
    # resolve. Everything under js/ is either generated output or an installed
    # dependency, and node_modules vendors .proto files that would otherwise join the
    # module and fail to build.
    excludes:
      - js
lint:
  use:
    - STANDARD
  except:
    # The schema nests enums inside the message they describe, which protobuf.dev permits
    # and which protoc already prefixes for C++; prefixing in source would spell the enum
    # name twice. ord.ReactionRole and its peers also read UNSPECIFIED and CUSTOM off any
    # message generically, which a per-enum prefix would break.
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    # Package "ord" predates the schema's first release and is the name every consumer
    # imports; a version suffix or a matching directory would rename the generated Python
    # and JavaScript packages.
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_VERSION_SUFFIX
    # reaction.proto and dataset.proto are package "ord"; test.proto is package "ord_test".
    - DIRECTORY_SAME_PACKAGE
breaking:
  use:
    - FILE
