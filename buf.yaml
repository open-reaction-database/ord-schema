version: v2
modules:
  - path: proto
    name: buf.build/open-reaction-database/ord-schema
lint:
  use:
    - STANDARD
  except:
    # The schema nests enums inside the message they describe, which protobuf.dev permits
    # and which protoc already prefixes for C++; prefixing in source would spell the enum
    # name twice. Validation also reads UNSPECIFIED and CUSTOM off any type/details
    # message generically, which a per-enum prefix would break.
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    # A matching directory would move the sources to ord/ and ord_test/, renaming the
    # generated Python and JavaScript packages every consumer imports. A version suffix
    # would rename every fully-qualified type, ord.Reaction to ord.v1.Reaction.
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_VERSION_SUFFIX
    # reaction.proto and dataset.proto are package "ord"; test.proto is package "ord_test".
    - DIRECTORY_SAME_PACKAGE
breaking:
  use:
    - FILE
  # The renames of ReactionSetup.automation_code to procedure_code and of
  # ProductCompound.texture to isolated_texture keep their field numbers, so binary
  # and Parquet data read as before; only text-format and JSON names change. Being
  # a map, procedure_code also renames the synthetic entry message
  # (AutomationCodeEntry to ProcedureCodeEntry), which buf reports as a deleted
  # message and a changed field type although map entries are encoded by field
  # number. These exemptions cover the whole file, FIELD_SAME_TYPE included, so
  # remove them once a release carrying the renames is tagged.
  ignore_only:
    FIELD_SAME_TYPE:
      - proto/ord-schema/proto/reaction.proto
    MESSAGE_NO_DELETE:
      - proto/ord-schema/proto/reaction.proto
    FIELD_SAME_NAME:
      - proto/ord-schema/proto/reaction.proto
    FIELD_SAME_JSON_NAME:
      - proto/ord-schema/proto/reaction.proto
