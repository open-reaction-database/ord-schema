[tool.bumpversion]
current_version = "0.9.0"
commit = true
tag = true
message = "Bump version: {current_version} → {new_version} [skip actions]"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "uv.lock"
search = """
[[package]]
name = "ord-schema"
version = "{current_version}"
"""
replace = """
[[package]]
name = "ord-schema"
version = "{new_version}"
"""

[[tool.bumpversion.files]]
glob = "js/*/package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

# Each lockfile records the package's own version in two entries, both a "version" directly
# after "name": "ord-schema...". Locked dependencies have no such name line, so one at the
# same version is left alone.
[[tool.bumpversion.files]]
glob = "js/*/package-lock.json"
regex = true
search = '"name": "(?P<package>ord-schema[-a-z]*)",(?P<gap>\s+)"version": "{current_version}"'
replace = '"name": "\g<package>",\g<gap>"version": "{new_version}"'
