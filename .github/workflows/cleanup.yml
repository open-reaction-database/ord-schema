name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check_licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '>=1.16'
      - name: Install dependencies
        run: |
          go install github.com/google/addlicense@v1.2.0
      - name: addlicense
        run: |
          "${HOME}/go/bin/addlicense" -check -c "Open Reaction Database Project Authors" -l apache .

  check_python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: '3.11'
      - name: Install ord-schema
        run: uv sync --extra examples --extra tests --locked
      - name: Verify bump2version config (dry-run)
        run: |
          uv pip install --system bump2version
          bump2version patch --dry-run --verbose
      - name: Run ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      # ty: ord_schema only. Under examples/ we ship notebooks (no .py); those are exercised in
      # test_notebooks (treon), not static type-checking here.
      - name: Run ty
        run: |
          uv run ty check ord_schema

  check_proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: clang-format
        run: |
          sudo apt update && sudo apt install clang-format --yes
          find . -name '*.proto' -exec clang-format -n -Werror --style=file {} +

  check_markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: markdownlint-cli2
        # Pinned to the same version as the pre-commit hook so CI and local runs agree.
        run: npx --yes markdownlint-cli2@0.23.1 "**/*.md"
