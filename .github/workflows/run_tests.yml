name: Tests

on:
  pull_request:
  push:
    branches:
      - main

# Superseded PR runs are pointless work: a push replaces the commit under test. Cancel them
# rather than letting a stale full matrix run to completion. Never cancel on main, where each
# push's result is the record for that commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test_ord_schema:
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-14"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      # Only ${{ }} is expanded in env values, so $GITHUB_WORKSPACE here would stay a literal
      # and initdb would create a directory named after the variable.
      PGDATA: ${{ github.workspace }}/rdkit-postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Rotates the cache weekly. The action already appends a hash of the environment file to
      # the key, so a spec change invalidates on its own -- but nothing in this repo changes
      # when conda-forge publishes a newer rdkit-postgresql, and a cache entry is not re-saved
      # once its key hits exactly. Without a rotating component the entry would stay pinned to
      # the first build ever cached.
      - name: Compute weekly cache epoch
        id: cache-epoch
        run: echo "value=$(date -u +%Y-%V)" >> "$GITHUB_OUTPUT"
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          # micromamba over conda: the environment and download caches are built into the
          # action -- keyed on a hash of this file plus the environment name and OS -- so there
          # is no cache wiring to hand-roll, and conda-forge is the only channel by
          # construction. Mambaforge, which used to be the way to get that, is retired; its
          # configuration and Miniforge3's are identical now.
          environment-file: .github/conda-postgres.yml
          init-shell: bash
          cache-environment: true
          cache-downloads: true
          cache-environment-key: conda-postgres-${{ steps.cache-epoch.outputs.value }}
          cache-downloads-key: conda-postgres-downloads-${{ steps.cache-epoch.outputs.value }}
      - name: Initialize the PostgreSQL data directory
        # -l activates the environment installed above (so initdb resolves); -eo pipefail
        # because a bare `shell:` string is used verbatim and would otherwise drop them.
        shell: bash -leo pipefail {0}
        run: initdb
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          # Key the wheel cache on the lockfile so a dependency bump, and only a dependency
          # bump, misses.
          cache-dependency-glob: "uv.lock"
      - name: Install ord_schema
        run: uv sync --extra tests --locked
      - name: Run tests
        # -l activates the conda environment so testing.postgresql finds initdb; -eo pipefail
        # because a bare `shell:` string is used verbatim, and without -e a failing pytest is
        # masked by the coverage report below, whose exit code would become the step's.
        shell: bash -leo pipefail {0}
        # Exercise the live PubChem/OPSIN resolver smoke tests on a single matrix
        # entry only; running them on all 8 jobs at once trips PubChem's per-IP
        # throttling (503 ServerBusy). Other entries skip them (see resolvers_test).
        env:
          ORD_LIVE_RESOLVERS: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        run: |
          uv run coverage erase
          # -n auto: the ORM tests run one PostgreSQL cluster per xdist worker and clone a
          # database per test, so the suite is parallel-safe; pytest-cov aggregates coverage
          # across workers.
          # --dist worksteal: the default scheduler hands each worker a fixed slice up front,
          # and the ORM tests are both contiguous in collection order and the slowest here, so
          # a worker that draws them finishes late while the other waits. Work stealing lets an
          # idle worker take queued tests instead. Measured at the two workers a runner gives:
          # 62s to 54s. It costs one PostgreSQL cluster per worker that ends up with an ORM
          # test, which is bounded by the worker count.
          # -ra: summarize all non-passing outcomes (failures, errors, and skip reasons) at the end of the run --
          # e.g. live resolver tests gated off this matrix entry vs. skipped on a PubChem 503.
          uv run pytest -n auto --dist worksteal -vv -ra --cov=ord_schema --durations=20
          # Print the coverage summary in the job log (no external upload).
          uv run coverage report

  test_notebooks:
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-14"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      # CPU-only runners: avoid TensorFlow probing CUDA (noise + unstable kernels).
      CUDA_VISIBLE_DEVICES: "-1"
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          # TensorFlow is the bulk of this extra; key its wheel cache on the lockfile.
          cache-dependency-glob: "uv.lock"
      - name: Install ord_schema
        run: uv sync --extra examples --extra tests --locked
      # The runs are serial: loading TensorFlow in several kernels at once OOMs the runner.
      #
      # Executing a notebook proves its code runs; comparing its stored output proves the
      # file a reader sees still says what the code produces. A stored output that has
      # gone stale is a lie in the most-read documentation the project has. Only the
      # notebooks whose every output reproduces on another machine can be held to the
      # second standard.
      - name: Test notebooks (compare stored output)
        run: >
          uv run pytest --nbval --nbval-current-env -vv -ra
          --nbval-sanitize-with examples/nbval_sanitize.cfg
          examples/submissions/2_Nielsen_Deoxyfluorination_Screen/example_nielsen.ipynb
          examples/submissions/3_Liu_Copper_OrgSyn/example_liu.ipynb
          examples/submissions/9_Ahneman_Science_CN_Coupling/example_Ahenman.ipynb
      # The rest draw figures or train models, and neither an SVG nor a fitted network
      # reproduces off the machine that made it, so their outputs are not comparable and
      # nbval only skips PNG and JPEG. They are executed and nothing more. Runs even when
      # the strict step failed: a cosmetic output diff must not cost these notebooks their
      # execution coverage.
      - name: Test notebooks (execution only)
        if: ${{ !cancelled() }}
        run: >
          uv run pytest --nbval-lax --nbval-current-env -vv -ra
          examples
          --ignore=examples/submissions/2_Nielsen_Deoxyfluorination_Screen/example_nielsen.ipynb
          --ignore=examples/submissions/3_Liu_Copper_OrgSyn/example_liu.ipynb
          --ignore=examples/submissions/9_Ahneman_Science_CN_Coupling/example_Ahenman.ipynb
          --ignore=examples/applications/Perera_Science_Granda_Nature_Suzuki
      # TensorFlow ships no CPython 3.14 wheels as of 2.21.0, so this notebook cannot run
      # on that interpreter; the other six can, and this is the only job that exercises
      # them at all.
      - name: Test notebooks (the one that needs TensorFlow)
        if: ${{ !cancelled() && matrix.python-version != '3.14' }}
        run: >
          uv run pytest --nbval-lax --nbval-current-env -vv -ra
          examples/applications/Perera_Science_Granda_Nature_Suzuki

  test_proto_wrappers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install protoc
        # Unpack outside the checkout. These binaries are not gitignored, so in the workspace
        # they pollute the drift check below and `addlicense .` rewrites their headers.
        run: |
          mkdir "${RUNNER_TEMP}/protoc"
          cd "${RUNNER_TEMP}/protoc"
          wget https://github.com/protocolbuffers/protobuf/releases/download/v22.3/protoc-22.3-linux-x86_64.zip
          echo "0f8070d762eb8a2f5a13a47713a553f989f9d9b556e7e3ebfa2bd6464e2ecaeb  protoc-22.3-linux-x86_64.zip" | sha256sum -c -
          unzip protoc-22.3-linux-x86_64.zip
          wget https://github.com/protocolbuffers/protobuf-javascript/releases/download/v3.21.2/protobuf-javascript-3.21.2-linux-x86_64.zip
          echo "075ed6163fea314c415f67a4af68d1b6dbddc8fa8be35addf74e4c81812a9148  protobuf-javascript-3.21.2-linux-x86_64.zip" | sha256sum -c -
          unzip protobuf-javascript-3.21.2-linux-x86_64.zip
          npm i -g ts-protoc-gen@0.15.0 protobufjs@7.4.0 protobufjs-cli@1.1.3
          PATH="${RUNNER_TEMP}/protoc/bin:$PATH" protoc --version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '>=1.16'
      - name: Install addlicense
        # Same pin as the check_licenses job in cleanup.yml: this job writes the headers that
        # one checks, so a floating version could make them disagree.
        run: go install github.com/google/addlicense@v1.2.0
      - name: Run protoc
        run: |
          PATH="${RUNNER_TEMP}/protoc/bin:$PATH" ./compile_proto_wrappers.sh
          "${HOME}/go/bin/addlicense" -c "Open Reaction Database Project Authors" -l apache .
      - name: Check for drift
        run: |
          # Stage everything first: git diff reports only tracked modifications, so a wrapper
          # generated for a brand-new .proto is untracked and would register as no drift at all.
          git add -A
          # -I ignores the copyright line so the year can change without failing.
          if ! git diff --cached --quiet -I "^(#| \*) Copyright"; then
            printf 'proto wrappers do not match:\n'
            git diff --cached -I "^(#| \*) Copyright"
            exit 1
          fi

  test_proto_breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # buf reads the baseline out of the local clone, so the full fetch is what
          # supplies it: a shallow checkout has neither main's history nor a ref that
          # points at it.
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          # Pin the CLI: a floating version can report new findings on a schema that
          # did not change.
          version: '1.72.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for breaking schema changes
        # Every .pb.gz and .parquet in ord-data is read by field number, so a renumbering
        # quietly changes what existing records mean instead of failing loudly.
        #
        # The baseline is the remote-tracking ref: checking out a pull request leaves HEAD
        # detached and creates no local main branch, so '#branch=main' resolves to nothing.
        run: buf breaking --against '.git#ref=origin/main'

  test_js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Test NPM package
        run: |
          cd js/ord_schema
          npm install-test

  test_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing requires Node >= 22.14 and npm >= 11.5.1 (https://docs.npmjs.com/trusted-publishers)
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Bump patch without commit (for publish dry-runs)
        run: |
          uv pip install --system bump2version
          # Dry-run first: assert .bumpversion.cfg and every configured file still contain the
          # expected current_version / search patterns before we mutate the tree (misconfig or
          # version drift fails here without leaving a half-updated checkout).
          bump2version patch --dry-run --verbose
          bump2version patch --no-commit --no-tag --verbose
      - name: Test python
        run: |
          # Same pre-upload steps as publish.yml; PyPI upload runs only on main with secrets.
          uv pip install --system build twine wheel
          python -m build
          python -m twine check dist/*
          # twine check covers the description and core metadata fields, but not PyPI's refusal
          # of direct (URL) dependencies, which otherwise fails at upload time in publish.yml.
          python .github/scripts/check_direct_dependencies.py dist/*
      - name: Test javascript
        run: |
          cd js/ord_schema
          npm install
          npm run build
          npm publish --dry-run
      - name: Test javascript (protobufjs)
        run: |
          cd js/ord-schema-protobufjs
          npm install
          npm run build
          npm publish --dry-run
