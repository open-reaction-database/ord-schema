name: Push schema

on:
  push:
    branches:
      - main

# Pushes run one at a time and a newer one replaces any still waiting, so the BSR's main
# label cannot end on an older commit when two merges land close together.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push_proto:
    if: github.repository == 'open-reaction-database/ord-schema'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: '1.72.0'
          setup_only: true
      - name: Push to the BSR
        # Releases push from publish.yml: their version-bump commit carries [skip actions],
        # so this workflow does not run for it.
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: >-
          buf push
          --label main
          --source-control-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
