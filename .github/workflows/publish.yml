name: Publish

on:
  workflow_dispatch:
    inputs:
      level:
        description: 'Version bump level'
        type: choice
        # `major` is intentionally omitted for now; releases stay on 0.x with
        # patch/minor bumps only.
        options:
          - patch
          - minor
        default: patch

jobs:
  # PyPA recommends splitting build (low privilege) from publish (OIDC). We keep one job because
  # bump2version commits locally and we only push to main after PyPI + npm succeed; a second job
  # cannot check out that unpublished commit without pushing first or shipping a full repo artifact.
  publish:
    if: github.repository == 'open-reaction-database/ord-schema'
    runs-on: ubuntu-latest
    # Optional on PyPI: if the trusted publisher names a GitHub environment, add matching:
    #   environment:
    #     name: pypi
    #     url: https://pypi.org/project/ord-schema/
    permissions:
      contents: write
      id-token: write  # PyPI + npm trusted publishing (OIDC).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.ACTIONS_PUSH }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing requires Node >= 22.14 and npm >= 11.5.1 (https://docs.npmjs.com/trusted-publishers)
          node-version: '24'
          # https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages
          registry-url: 'https://registry.npmjs.org'
      - name: Bump version
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          uv pip install --system bump2version
          bump2version "${{ inputs.level }}" --verbose
      # PyPI Trusted Publishing (OIDC); configure at https://docs.pypi.org/trusted-publishers/
      # for this repo + workflow file publish.yml (no PYPI_API_TOKEN / legacy upload).
      - name: Build Python distributions
        run: |
          uv pip install --system build twine wheel
          python -m build
          python -m twine check dist/*
          # Fail before the upload (and before the version bump is pushed) rather than taking a
          # 400 from PyPI: twine check does not reject direct (URL) dependencies.
          python .github/scripts/check_direct_dependencies.py dist/*
      # uv does the OIDC exchange itself and uploads PEP 740 attestations by default,
      # so no third-party action runs in this job -- which matters here, because
      # id-token: write lets any step in it mint a token and publish a release.
      # --trusted-publishing always fails loudly rather than falling back to looking
      # for an API token that does not exist. Metadata is already checked above by
      # twine check and check_direct_dependencies.py.
      - name: Publish package distributions to PyPI
        run: uv publish --trusted-publishing always dist/*
      - name: Build and upload to NPM
        run: |
          cd js/ord_schema
          npm install
          npm run build
          npm publish
      - name: Build and upload to NPM (protobufjs)
        run: |
          cd js/ord-schema-protobufjs
          npm install
          npm run build
          npm publish
      - name: Push version bump and tags
        run: git push origin main --tags
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # https://gist.github.com/rponte/fdc0724dd984088606b0?permalink_comment_id=3064455#gistcomment-3064455
          TAG="$(git tag --sort=-v:refname | head -n 1)"
          gh release create "${TAG}" --generate-notes
