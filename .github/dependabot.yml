# Actions in .github/workflows are pinned to commit SHAs. Dependabot rewrites
# both the SHA and its trailing version comment, which is what keeps a pinned
# workflow from freezing on whatever was current the day it was written.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # One pull request per month for all actions rather than one per action.
      actions:
        patterns:
          - "*"
  # The code-generation toolchain in package.json. A bump that changes generated output
  # fails test_proto_wrappers until the pull request also regenerates the wrappers.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      codegen:
        patterns:
          - "*"
    ignore:
      # protobufjs-cli 2 needs protobufjs 8 at runtime and emits a default import of
      # protobufjs/minimal.js. webpack's default production build turns the bundle's
      # assignment to $protobuf.roots["default"] into an assignment to a call and fails, in
      # this repository's own build and in any consumer's. The pair moves together, by hand.
      - dependency-name: protobufjs
        update-types: ["version-update:semver-major"]
      - dependency-name: protobufjs-cli
        update-types: ["version-update:semver-major"]
  # The published npm packages. Their lockfiles pin what CI and the release install, while
  # consumers resolve from the package.json ranges, which npm publishes and these updates
  # leave alone.
  - package-ecosystem: npm
    directories:
      - /js/ord-schema
      - /js/ord-schema-protobufjs
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    groups:
      js-packages:
        patterns:
          - "*"
