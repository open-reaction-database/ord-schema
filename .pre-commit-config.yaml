repos:
  # Every change goes through a branch and a pull request, so a commit landing on main
  # is a mistake rather than a shortcut. Listed first so it fails before the slower
  # hooks spend time on a commit that should not exist.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      # Nothing else here reads pyproject.toml, .clang-format, the CSV fixtures, or the
      # docs: ruff and ty are Python, markdownlint is Markdown, clang-format is proto,
      # nbstripout is notebooks. These three are what covers the rest.
      #
      # The exclusions are exactly what compile_proto_wrappers.sh writes: protoc's
      # --python_out and --pyi_out, its --js_out and --ts_out under js/ord-schema/proto,
      # and the pbjs/pbts pair under js/ord-schema-protobufjs. The test_proto_wrappers
      # job regenerates all of it and fails on any drift, so a hook that edited one
      # would fail that job on every run until someone noticed which of the two
      # authorities over those bytes to believe.
      #
      # Nothing else under js/ is generated. The entry points at js/ord-schema/index.js
      # and index.d.ts are hand-written, as are package.json, webpack.config.js, and the
      # _pb.test.js suites, so all of them are covered.
      - id: check-toml
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            js/ord-schema-protobufjs/index\.(js|d\.ts)
            |js/ord-schema/proto/[a-z_]+_pb\.(js|d\.ts)
            |ord_schema/proto/.*_pb2\.pyi?
          )$
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            js/ord-schema-protobufjs/index\.(js|d\.ts)
            |js/ord-schema/proto/[a-z_]+_pb\.(js|d\.ts)
            |ord_schema/proto/.*_pb2\.pyi?
          )$

  - repo: https://github.com/google/addlicense
    rev: v1.2.0
    hooks:
      - id: addlicense
        args:
          - -c
          - Open Reaction Database Project Authors
          - -l
          - apache

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty-check
        name: ty check (ord_schema)
        entry: uv run --extra tests ty check ord_schema
        language: system
        pass_filenames: false

  # Rewrites each notebook through nbformat, which is what settles how the JSON is
  # written: tools disagree on whether a multi-line output is one string or a list of
  # lines, and an edit through any of them reformats whatever it touches. It also drops
  # the timings that executing a notebook stamps on every cell -- metadata.execution and
  # ExecuteTime -- which change on every run whether or not the output did, and which
  # nothing reads, since nbval compares outputs and ignores cell metadata.
  #
  # The output is what #995 made contributors keep current, and the execution counts
  # tell a reader what ran in what order, so both stay.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args: [--keep-output, --keep-count, --keep-id]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.2
    hooks:
      - id: clang-format
        types_or: [proto]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.1
    hooks:
      - id: markdownlint-cli2
