# Substitutions applied to both stored and freshly computed notebook output before
# nbval compares them, so that output which cannot reproduce does not have to be
# excluded from checking altogether.
#
# Keep this list short. Every pattern here is a cell whose output nobody is reading
# closely, and a pattern broad enough to hide a real change earns nothing.

# The submission notebooks stamp ReactionProvenance.record_created with the moment
# they run, rendered by strftime as "%m/%d/%Y, %H:%M:%S". The surrounding record is
# still compared; only the instant is masked.
[record-created-timestamp]
regex: \d{2}/\d{2}/\d{4}, \d{2}:\d{2}:\d{2}
replace: RECORD_CREATED_TIME

# example_Ahenman times its own validation pass and prints how long it took. The entry
# count beside it is not masked, so a change in what gets validated still shows up.
[validation-elapsed-seconds]
regex: Entries: [0-9.]+ s
replace: Entries: ELAPSED s

# RDKit prefixes its warnings on stderr with the wall-clock time they were emitted.
# The warning text itself is still compared.
[rdkit-log-timestamp]
regex: \[\d{2}:\d{2}:\d{2}\]
replace: [RDKIT_LOG_TIME]
